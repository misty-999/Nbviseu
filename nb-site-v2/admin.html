<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de eventos | NB Club Viseu</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080808">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="adm-body">
  <header class="adm-top">
    <a class="logo" href="index.html" aria-label="NB — voltar ao site">NB<i></i></a>
    <p class="eyebrow">Gestão de eventos</p>
    <a class="link" href="index.html">Ver site</a>
  </header>

  <main class="adm" id="main">
    <p class="adm-status" id="status" role="status" aria-live="polite"></p>

    <!-- Acesso -->
    <section id="gate" class="adm-card" aria-labelledby="gate-h">
      <h1 class="h-md" id="gate-h">ACESSO.</h1>
      <p class="adm-help" id="gateHelp"></p>
      <form id="gateForm" novalidate>
        <label class="field"><span>Palavra-passe</span><input id="pw" type="password" autocomplete="current-password" required></label>
        <label class="field" id="pw2Wrap" hidden><span>Confirmar palavra-passe</span><input id="pw2" type="password" autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit"><span id="gateBtn">ENTRAR</span></button>
      </form>
    </section>

    <!-- Painel -->
    <section id="panel" hidden aria-label="Painel de eventos">
      <div class="adm-note">
        As alterações ficam guardadas <strong>neste navegador</strong>. Para publicar para todos os visitantes,
        usa <strong>Exportar events.json</strong> e substitui o ficheiro <code>events.json</code> no alojamento do site.
      </div>

      <div class="adm-bar">
        <button class="btn btn-primary" id="newBtn" type="button"><span>NOVO EVENTO</span></button>
        <button class="btn" id="exportBtn" type="button"><span>EXPORTAR events.json</span></button>
        <label class="btn" for="importFile"><span>IMPORTAR</span></label>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <button class="btn" id="resetBtn" type="button"><span>REPOR DO FICHEIRO</span></button>
        <button class="btn" id="logoutBtn" type="button"><span>TERMINAR SESSÃO</span></button>
      </div>

      <div id="list" class="adm-list" aria-live="polite"></div>

      <form id="editor" class="adm-card" hidden novalidate aria-labelledby="ed-h">
        <h2 class="h-md" id="ed-h">NOVO EVENTO.</h2>
        <div class="adm-fields">
          <label class="field"><span>Nome do evento *</span><input id="f-title" type="text" required maxlength="90"></label>
          <label class="field"><span>DJ ou artista</span><input id="f-artist" type="text" maxlength="90"></label>
          <label class="field"><span>Data</span><input id="f-date" type="date"></label>
          <label class="field"><span>Horário</span><input id="f-time" type="time"></label>
          <label class="field wide"><span>Poster (caminho ou URL, ex.: media/poster-01.jpg)</span><input id="f-poster" type="text"></label>
          <div class="field wide">
            <span>Ou carregar imagem</span>
            <input id="f-file" type="file" accept="image/*">
            <div class="poster-prev" id="posterPrev" hidden></div>
          </div>
          <label class="field wide"><span>Descrição</span><textarea id="f-desc" rows="5" maxlength="1500"></textarea></label>
          <label class="field wide"><span>Bilhetes em pré-venda (https://...)</span><input id="f-ticket" type="url"></label>
          <label class="field wide"><span>Bilheteira no dia do evento, ex.: Ticketline (https://..., opcional)</span><input id="f-door" type="url"></label>
          <label class="check"><input id="f-pub" type="checkbox" checked> <span>Publicado no site</span></label>
          <label class="check"><input id="f-demo" type="checkbox"> <span>Marcar como conteúdo de demonstração</span></label>
        </div>
        <div class="adm-bar">
          <button class="btn btn-primary" type="submit"><span>GUARDAR</span></button>
          <button class="btn" id="cancelBtn" type="button"><span>CANCELAR</span></button>
        </div>
      </form>
    </section>
  </main>

  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
